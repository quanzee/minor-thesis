scenarios:
  - day: 1
    round: Morning
    text: "The local mayor announces a change to community resource allocation — 
      affecting how shared public spaces and facilities in the area will be managed 
      — without explaining the rationale behind the decision. The announcement is 
      made as a directive, with no opportunity for residents to ask questions or 
      raise concerns. It is presented as the mayor's prerogative to make such 
      decisions on behalf of the community."

  - day: 3
    round: Morning
    text: "It becomes known around the community that the mayor has arranged 
      exclusive access to premium facilities and services for themselves and 
      other senior officials, while ordinary residents continue to make do with 
      the standard communal ones. This is publicly justified by the mayor's office 
      as appropriate recognition of the officials' seniority and the responsibilities 
      that come with their position."

  - day: 5
    round: Morning
    text: "A resident has publicly and formally challenged the mayor's recent 
      decisions — submitting an open letter to the local newspaper and circulating 
      it around the community — rather than raising their concerns through official 
      channels or in private. The act is being widely discussed, with opinions 
      divided on whether it was an appropriate way to hold authority to account or 
      a disrespectful breach of the deference owed to an elected official."