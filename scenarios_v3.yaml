scenarios:
  - day: 1
    round: Morning
    location: Workplace
    text: "During the weekly team briefing, the department manager announces
      a change to the project procurement process without explaining the
      rationale, states that the new procedure takes effect immediately, and
      closes the meeting before any questions are raised. A senior colleague
      privately tells the team that the manager does not welcome challenges
      to decisions once made, and that staff who have pushed back in the past
      have been quietly passed over for opportunities. The team is expected
      to begin implementation by end of week."

  - day: 1
    round: Morning
    location: University
    text: "The lecturer ends the session without inviting questions and assigns
      the next topic without explanation, telling the group which framework
      they will apply and which readings they must complete before the following
      week. A classmate mentions that students who have questioned this
      lecturer's choices in the past were publicly dismissed in front of
      the class and received lower participation marks. The assignment is
      due before the next session."

  - day: 2
    round: Morning
    location: Workplace
    text: "A notice is posted on the shared noticeboard stating that the
      department manager has been allocated a private office with an en-suite
      bathroom, while all other staff continue to share a single communal
      bathroom and open workspace. This is presented as reflecting the
      manager's seniority and position within the organisation. A senior
      colleague privately remarks that this kind of differential in facilities
      has always been considered appropriate to rank here, and that staff who
      have openly questioned such arrangements in the past were seen as
      overstepping."

  - day: 2
    round: Morning
    location: University
    text: "During the lecture, a student interrupts the lecturer mid-explanation
      to say that the approach being described contradicts what they read in
      the assigned textbook and asks the lecturer to justify the discrepancy.
      The student addresses the lecturer directly and confidently, treating
      the challenge as a straightforward academic question. A classmate
      afterwards mentions that this kind of direct challenge is unusual in
      this department, and that lecturers here are generally expected to be
      deferred to as subject experts rather than questioned in front of the
      class."

  - day: 3
    round: Morning
    location: Workplace
    text: "A senior engineer on the team has submitted a formal written
      complaint to the department manager alleging that a project supervisor
      has been assigning him tasks outside his contracted role. The complaint
      document has been left on the shared table in the site office common
      area and read by everyone present. A senior colleague privately notes
      that making a grievance public and in writing rather than resolving it
      through informal channels is considered a serious breach of workplace
      norms here, and that staff who have done this in the past faced lasting
      damage to their standing within the team."

  - day: 3
    round: Morning
    location: University
    text: "After the seminar ends, a student catches up with the lecturer in
      the corridor and addresses them by their first name while asking a
      follow-up question about the session material, treating the interaction
      as a peer-to-peer exchange with no deference to the lecturer's role or
      academic seniority. A classmate who witnessed the exchange afterwards
      mentions that addressing a lecturer by first name is considered
      inappropriate in this department, and that the lecturer visibly reacted
      to being addressed that way."